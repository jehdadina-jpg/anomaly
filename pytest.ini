[pytest]
# Pytest configuration for prediction system tests

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for system components
    property: Property-based tests using hypothesis
    slow: Tests that take significant time to run
    model: Tests involving model training or inference
    
# Hypothesis settings
# Default deadline disabled for model training tests
# which can be slow
hypothesis_profile = default

[hypothesis]
# Hypothesis configuration
max_examples = 100
deadline = None
verbosity = normal
